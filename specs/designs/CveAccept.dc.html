<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accept risk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c18;color:#eceafa;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45}
:focus-visible{outline:2px solid #a390fb;outline-offset:2px}
h1,h2,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #2e3056;background:#1b1c34;color:#eceafa;font:500 13.5px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:#a390fb;border-color:#a390fb;color:#0b0c18;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-weight:600;font-size:13px}
.help{color:#9b98b8;font-size:12.5px}
.input{min-height:40px;border-radius:8px;border:1px solid #2e3056;background:#0f1022;color:#eceafa;padding:0 12px;font:14px 'Inter',sans-serif;width:100%;box-sizing:border-box}
textarea.input{padding:10px 12px;min-height:104px;resize:vertical;line-height:1.5}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: rgba(5,6,14,0.78); display: flex; align-items: center; justify-content: center; padding: 24px">
  <div role="dialog" aria-modal="true" aria-labelledby="dlg-h" style="width: 100%; max-width: 520px; box-sizing: border-box; background: #15162a; border: 1px solid #2e3056; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h2 id="dlg-h" style="font-size: 18px; font-weight: 650">Accept risk for <span style="font-family: 'JetBrains Mono', monospace; font-weight: 500">CVE-2024-45337</span></h2>
        <p style="color: #b4b1d0; font-size: 13px">Applies to every tag of platform/api-gateway. No new issue is created while the acceptance is active. The open issue #214 stays open and gets a comment with your name and reason.</p>
      </div>
      <button type="button" aria-label="Close" style="width: 36px; height: 36px; flex: none; border: 0; border-radius: 8px; background: transparent; color: #9b98b8; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="field">
      <label class="label" for="r">Reason</label>
      <textarea id="r" class="input" required>The vulnerable SSH server code path is not compiled into this service; it only uses x/crypto for TLS helpers. Upgrade planned in the 1.43 release.</textarea>
    </div>
    <div class="field">
      <label class="label" for="e">Expires on <span style="font-weight: 400; color: #9b98b8">(optional)</span></label>
      <span class="help">After this date the CVE counts again. Leave empty for no expiry.</span>
      <input id="e" class="input" type="date" value="2027-01-31">
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding-top: 4px">
      <button type="button" class="btn">Cancel</button>
      <button type="button" class="btn btn-primary">Accept risk</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
