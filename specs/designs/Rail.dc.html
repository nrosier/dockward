<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; padding: 16px 12px 20px; display: flex; flex-direction: column; gap: 4px; font-family: 'Inter', system-ui, sans-serif; color: #eceafa; background: #0f1020">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 18px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #eceafa; text-decoration: none">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #a390fb; color: #0b0c18; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"></path><path d="M9 21v-7h6v7"></path></svg>
      </span>
      <span style="font-weight: 700; font-size: 15px; letter-spacing: -0.01em">HarborGate</span>
    </a>
    <button type="button" aria-label="Collapse sidebar" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #9b98b8; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path><path d="m16 15-3-3 3-3"></path></svg>
    </button>
  </div>

  <a href="Main.dc.html" aria-current="{{n.dashboard.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.dashboard.bg}}; color: {{n.dashboard.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
    Dashboard
  </a>
  <a href="Mappings.dc.html" aria-current="{{n.mappings.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.mappings.bg}}; color: {{n.mappings.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg>
    Mappings
  </a>
  <a href="Cves.dc.html" aria-current="{{n.cves.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.cves.bg}}; color: {{n.cves.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
    CVEs
  </a>
  <a href="SyncJobs.dc.html" aria-current="{{n.sync.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.sync.bg}}; color: {{n.sync.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
    Sync jobs
  </a>

  <div style="height: 1px; background: #22233f; margin: 20px 6px"></div>

  <a href="AdminJobs.dc.html" aria-current="{{n.admin.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.admin.bg}}; color: {{n.admin.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
    Admin
  </a>
  <a href="Account.dc.html" aria-current="{{n.account.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; background: {{n.account.bg}}; color: {{n.account.fg}}">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    Account
  </a>

  <div style="margin-top: 20px; padding: 12px; border-radius: 8px; border: 1px solid #22233f; font-size: 12px; color: #9b98b8; display: flex; flex-direction: column; gap: 2px">
    <span>Signed in as <span style="color: #eceafa; font-weight: 600">ops-admin</span></span>
    <span>Admin · local account</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","mappings","cves","sync","admin","account"],"default":"dashboard"},"$preview":{"width":232,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const keys = ['dashboard', 'mappings', 'cves', 'sync', 'admin', 'account'];
    const n = {};
    keys.forEach((k) => {
      const on = k === active;
      n[k] = { bg: on ? '#23244a' : 'transparent', fg: on ? '#eceafa' : '#b4b1d0', cur: on ? 'page' : 'false' };
    });
    return { n };
  }
}
</script>
</body>
</html>
