<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c18;color:#eceafa;font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#a390fb;text-decoration:none}a:hover{color:#c4b8fd;text-decoration:underline}
:focus-visible{outline:2px solid #a390fb;outline-offset:2px}
h1,p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #2e3056;background:#1b1c34;color:#eceafa;font:500 14px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none;width:100%;box-sizing:border-box}
.btn:hover{background:#23244a;text-decoration:none;color:#eceafa}
.btn-primary{background:#a390fb;border-color:#a390fb;color:#0b0c18;font-weight:600}
.btn-primary:hover{background:#b6a6fc;color:#0b0c18}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-weight:600;font-size:13px}
.input{min-height:44px;border-radius:8px;border:1px solid #2e3056;background:#0f1022;color:#eceafa;padding:0 12px;font:14px 'Inter',sans-serif;width:100%;box-sizing:border-box}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #0b0c18">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 10px; background: #a390fb; color: #0b0c18; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l8-5 8 5v13"></path><path d="M9 21v-7h6v7"></path></svg>
    </span>
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">HarborGate</span>
  </div>

  <main style="width: 100%; max-width: 400px; box-sizing: border-box; background: #15162a; border: 1px solid #25264a; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="font-size: 20px; font-weight: 650">Sign in</h1>
      <p style="color: #9b98b8; font-size: 13px">Harbor scan results, delivered to GitHub.</p>
    </div>

    <a class="btn" href="Main.dc.html">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
      Sign in with single sign-on
    </a>

    <div style="display: flex; align-items: center; gap: 12px; color: #9b98b8; font-size: 12px">
      <span style="flex: 1; height: 1px; background: #25264a"></span>
      or use a local account
      <span style="flex: 1; height: 1px; background: #25264a"></span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px">
      <div class="field">
        <label class="label" for="u">Username</label>
        <input id="u" class="input" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="p">Password</label>
        <input id="p" class="input" type="password" autocomplete="current-password">
      </div>
      <a class="btn btn-primary" href="Main.dc.html">Sign in</a>
    </form>
  </main>

  <p style="max-width: 400px; text-align: center; color: #9b98b8; font-size: 12.5px">Admins can always sign in with a local password. Your administrator may limit other users to single sign-on.</p>
</div>
</x-dc>

</body>
</html>
