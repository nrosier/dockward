name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Deny all token permissions by default. Each job grants only what it needs.
permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: harborgate:ci
          # The revision build argument is required by the Dockerfile, so every image carries the label.
          build-args: |
            REVISION=${{ github.sha }}
          # Provenance is disabled on the PR build path only. Empty means the buildx default on push.
          provenance: ${{ github.event_name == 'pull_request' && 'false' || '' }}

      # Each job runs on its own runner, so the image is passed to the scan job as an artifact.
      - name: Save image archive
        env:
          IMAGE: harborgate:ci
        run: docker save "$IMAGE" -o "$RUNNER_TEMP/harborgate-ci.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harborgate-ci-image
          path: ${{ runner.temp }}/harborgate-ci.tar
          retention-days: 1
          if-no-files-found: error

  scan:
    name: Trivy scan
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: harborgate-ci-image
          path: ${{ runner.temp }}/image

      - name: Load image
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: docker load -i "$IMAGE_DIR/harborgate-ci.tar"

      - name: Trivy scan (fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: harborgate:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  publish-digest:
    name: Publish image by digest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only GITHUB_TOKEN is used for registry auth. No registry password is stored.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels are computed here so the image config carries them. Only the labels output is used in this job.
      # The tags block matches promote, so the version label is the same in both jobs.
      - name: Compute image labels
        id: meta-digest
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/harborgate
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Untagged push: the image is stored by digest only. Tags are added to this digest in promote.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The Dockerfile requires REVISION, and it also sets the label from it. The label stays set
          # explicitly here, so HarborGate can read the source commit (org.opencontainers.image.revision).
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            ${{ steps.meta-digest.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/harborgate,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

  scan-digest:
    name: Trivy scan (digest)
    needs: publish-digest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # only for the SARIF upload
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Scans the exact digest that promote tags, signs and attests.
      - name: Trivy scan (fails on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/harborgate@${{ needs.publish-digest.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Trivy scan (SARIF)
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/harborgate@${{ needs.publish-digest.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload SARIF to Code Scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-results.sarif

  promote:
    name: Apply tags, sign and attest
    needs: [publish-digest, scan-digest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Only GITHUB_TOKEN is used for registry auth. No registry password is stored.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest is only applied from main. A v* tag never moves latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/harborgate
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Adds each tag to the scanned digest. No new image is built, so the digest does not change.
      - name: Apply tags to digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/harborgate
          DIGEST: ${{ needs.publish-digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker buildx imagetools create -t "$tag" "${IMAGE}@${DIGEST}"
          done <<< "$TAGS"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing using the workflow's OIDC identity (id-token: write). Signs the digest that was scanned.
      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/harborgate
          DIGEST: ${{ needs.publish-digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verifies the signature just made, on the same digest, pinned to this repository's publish workflow on main or a v* tag.
      # A failed verification fails the job. Output goes to /dev/null to keep the Rekor and certificate detail out of the log.
      - name: Verify image signature
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/harborgate
          DIGEST: ${{ needs.publish-digest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/nrosier/harborgate/\.github/workflows/docker\.yml@refs/(heads/main|tags/v[0-9].*)$' \
            "${IMAGE}@${DIGEST}" > /dev/null

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/harborgate # must be lowercase
          subject-digest: ${{ needs.publish-digest.outputs.digest }}
          push-to-registry: true
