[package]
name = "harborgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.23.1"
hkdf = "0.12"
hmac = "0.12"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
zeroize = "1"

[dev-dependencies]
aws-lc-rs = "1.19.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tower = { version = "0.5", features = ["util"] }
