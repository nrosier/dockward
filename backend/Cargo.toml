[package]
name = "harborgate"
version = "0.12.5"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
axum = "0.8.9"
base64 = "0.23.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
hkdf = "0.13"
hmac = "0.13"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "builder", "rustls-platform-verifier"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
zeroize = "1"

[dev-dependencies]
aws-lc-rs = "1.19.0"
jsonschema = { version = "0.60", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tower = { version = "0.5", features = ["util"] }
