[package]
name = "harborgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.23.1"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
zeroize = "1"
