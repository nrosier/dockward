# cargo-deny policy. Run from backend/ with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# 2026-11-09, decided by the user in issue #263.
# Reason: no released SQLx allows libsqlite3-sys 0.39 or newer yet, and
# Dockward's local SQLite file is not writable by untrusted parties.
# Removal: remove this entry when SQLx ships a release that allows
# libsqlite3-sys 0.39 or newer. Check at each Renovate update.
# Keep in step with backend/.cargo/audit.toml.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
version = 2
allow = [
    "MIT",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
