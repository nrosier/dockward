# EXAMPLE compose file for Dockward. Copy it, then:
#   1. Set the hostname (dockward.example.com) in the labels below.
#   2. Set the image tag (latest is used here; pin a version tag for production).
#   3. Create a .env file next to this file that contains DOCKWARD_ENCRYPTION_KEY.
#      Do not put any key value in this file.
# .env must not be committed.
services:
  dockward:
    # Pin a version tag for production instead of latest.
    image: ghcr.io/nrosier/dockward:latest
    container_name: dockward
    restart: unless-stopped
    # PID 1 does not reap children or forward signals on its own.
    init: true
    # Everything writable lives in the volume, so the rest can be immutable.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockward", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - data:/data
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Router (replace dockward.example.com with your hostname)
      - "traefik.http.routers.dockward.rule=Host(`dockward.example.com`)"
      - "traefik.http.routers.dockward.entrypoints=websecure"
      - "traefik.http.routers.dockward.tls.certresolver=cloudflare"
      - "traefik.http.routers.dockward.priority=100"

      # Service
      - "traefik.http.services.dockward.loadbalancer.server.port=8080"

      # Cloudflare tunnel (replace dockward.example.com with your hostname)
      - "dockflare.enable=true"
      - "dockflare.hostname=dockward.example.com"
      # Replace https://192.168.1.2 with the Traefik or origin address for this host.
      - "dockflare.service=https://192.168.1.2"
      - "dockflare.http2_origin=true"
      - "dockflare.match_sni_to_host=true"

networks:
  proxy:
    external: true

volumes:
  data:
